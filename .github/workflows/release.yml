name: Release APK Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build Multi-ABI & Universal Release APKs
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PabiSplits

      - name: Verify Offline Manifest (Zero INTERNET Permission)
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Checking $apk"
            if apkanalyzer manifest permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "ERROR: INTERNET permission detected in $apk"
              exit 1
            fi
          done

      - name: Package Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/*.apk dist-release/
          cp app/build/outputs/mapping/release/mapping.txt dist-release/ || true
          (cd dist-release && sha256sum * > SHA256SUMS.txt)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: procpulse-release-apks
          path: dist-release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
