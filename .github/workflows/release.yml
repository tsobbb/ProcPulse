name: Build & Publish ProcPulse APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystores
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ -n "$SECRET_KEYSTORE_B64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$SECRET_KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release-upload.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release-upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets found; generating CI release signing key..."
            CI_PASS="procpulse_ci_release_key"
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/ci-release.jks" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=ProcPulse CI, O=OpenSource, C=US"
            echo "KEYSTORE_PATH=${{ github.workspace }}/ci-release.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Multi-ABI & Universal Release APKs
        run: gradle :app:assembleRelease -PabiSplits --no-daemon

      - name: Verify Offline Manifest (Zero INTERNET Permission)
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Checking permissions in $apk"
            if "$AAPT2" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "ERROR: INTERNET permission detected in $apk"
              exit 1
            fi
          done

      - name: Collect APKs, mapping.txt, and SHA-256 Checksums
        run: |
          mkdir -p dist-release
          cp app/build/outputs/apk/release/*.apk dist-release/
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt dist-release/
          fi
          (cd dist-release && sha256sum * > SHA256SUMS.txt)
          ls -lh dist-release

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: procpulse-release-apks
          path: dist-release/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-b{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('ProcPulse {0}', github.ref_name) || format('ProcPulse v1.0.0-b{0}', github.run_number) }}
          generate_release_notes: true
          files: dist-release/*
